name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Dart, Android and the example app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
      - name: The README's quick start is the compiled one
        run: python3 tool/check_readmes.py
      - name: Analyze and test the plugin (the Dart API against mocked platform channels)
        working-directory: packages/quranlab_tajweedformer
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: The microphone helper
        working-directory: packages/quranlab_tajweedformer_record
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: The example app, debug and release
        working-directory: packages/quranlab_tajweedformer/example
        run: |
          flutter test
          flutter build apk --debug
          flutter build apk --release
      - name: Kotlin unit tests
        working-directory: packages/quranlab_tajweedformer/example/android
        run: ./gradlew --no-daemon :quranlab_tajweedformer:testDebugUnitTest
      - name: Android's verifier rule on the plugin's classes
        run: python3 tool/check_monitor_handlers.py packages/quranlab_tajweedformer/example/build/quranlab_tajweedformer/tmp/kotlin-classes/release

  # The example app at other Android Gradle Plugin versions than its own, as apps have them: the lowest AGP this
  # Flutter accepts, the newest stable AGP and Gradle (read at run time), and the newest without the template's
  # android.newDsl and android.builtInKotlin lines (tool/agp_matrix.py says why).
  agp:
    name: The example app on AGP ${{ matrix.agp }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - agp: floor
            pin: --agp 9.1.1
          - agp: newest
            pin: --agp newest --gradle newest
          - agp: newest-defaults
            pin: --agp newest --gradle newest --defaults
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
      - name: Set the example's AGP (and Gradle)
        run: python3 tool/agp_matrix.py pin ${{ matrix.pin }}
      - name: The example app, debug
        working-directory: packages/quranlab_tajweedformer/example
        run: flutter build apk --debug
      - name: Kotlin unit tests and the plugin's release AAR
        working-directory: packages/quranlab_tajweedformer/example/android
        run: ./gradlew --no-daemon :quranlab_tajweedformer:testDebugUnitTest :quranlab_tajweedformer:bundleReleaseAar
      - name: Android's verifier rule on the plugin's release AAR
        run: python3 tool/check_monitor_handlers.py packages/quranlab_tajweedformer/example/build/quranlab_tajweedformer/outputs/aar/quranlab_tajweedformer-release.aar

  ios:
    name: iOS (simulator and device builds)
    # macos-26: the Apple SDK 4.0 is checked with the Swift of this image (6.3)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && swift --version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
      - name: Build the example for the simulator and for a device (Swift Package Manager)
        working-directory: packages/quranlab_tajweedformer/example
        run: |
          flutter config --enable-swift-package-manager
          flutter build ios --simulator --debug
          flutter build ios --release --no-codesign
