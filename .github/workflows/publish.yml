name: Publish to pub.dev

# pub.dev's automated publishing (GitHub's OIDC token, no secret anywhere): a tag v<version> publishes both packages
# at that version, quranlab_tajweedformer first, then quranlab_tajweedformer_record. Each package's Admin tab on
# pub.dev, under Automated publishing, names this repository (Quran-Lab/tajweedformer-flutter) and the tag pattern
# v{{version}}. Both pubspec.yaml files must carry the tag's version, and the jobs run only in this repository. A job
# that fails after the plugin was published is re-run on its own (Re-run failed jobs); the tag is never pushed again.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  check:
    name: Both pubspecs carry the tag's version
    if: github.repository == 'Quran-Lab/tajweedformer-flutter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          for p in packages/quranlab_tajweedformer packages/quranlab_tajweedformer_record; do
            grep -qx "version: $v" "$p/pubspec.yaml" || { echo "::error::$p/pubspec.yaml is not version $v"; exit 1; }
          done

  plugin:
    name: quranlab_tajweedformer
    needs: check
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/quranlab_tajweedformer

  record:
    name: quranlab_tajweedformer_record
    needs: plugin
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/quranlab_tajweedformer_record
