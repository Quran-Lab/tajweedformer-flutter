name: Publish to pub.dev

# pub.dev's automated publishing: a tag quranlab_tajweedformer-v<version> or quranlab_tajweedformer_record-v<version>
# publishes that package's version, once the package's Admin tab on pub.dev names this repository and the tag pattern.
# The version in the package's pubspec.yaml must equal the tag's. dart-lang/setup-dart sets up pub.dev's credentials
# from GitHub's OIDC token (no secret in this repository); the packages are Flutter packages, so Flutter publishes.
on:
  push:
    tags:
      - 'quranlab_tajweedformer-v[0-9]+.[0-9]+.[0-9]+'
      - 'quranlab_tajweedformer_record-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
      - name: The package the tag names
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            quranlab_tajweedformer_record-v*) echo "dir=packages/quranlab_tajweedformer_record" >> "$GITHUB_OUTPUT"; v="${GITHUB_REF_NAME#quranlab_tajweedformer_record-v}";;
            quranlab_tajweedformer-v*) echo "dir=packages/quranlab_tajweedformer" >> "$GITHUB_OUTPUT"; v="${GITHUB_REF_NAME#quranlab_tajweedformer-v}";;
            *) echo "::error::not a package tag"; exit 1;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: The pubspec's version is the tag's
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          WANT: ${{ steps.pkg.outputs.version }}
        run: |
          grep -qx "version: $WANT" pubspec.yaml || { echo "::error::pubspec.yaml is not version $WANT"; exit 1; }
      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          flutter pub get
          flutter pub publish --force
