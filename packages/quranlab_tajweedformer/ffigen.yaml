# The C SDK's public API as Dart, for Windows and Linux. src/tajweedformer.h is the header of the C SDK release the
# plugin pins (the release zip's own file, unchanged). After it changes, regenerate from this folder:
#
#   dart run ffigen --config ffigen.yaml
#
# CI checks that the generated file is current.
name: TfBindings
description: 'The TajweedFormer C SDK (src/tajweedformer.h), generated by ffigen. Do not edit.'
output: 'lib/src/ffi/tajweedformer.g.dart'
headers:
  entry-points:
    - 'src/tajweedformer.h'
  include-directives:
    - 'src/tajweedformer.h'
functions:
  include:
    - 'tf_.*'
structs:
  include:
    - 'Tf.*'
unions:
  include: []
enums:
  include:
    - 'TfError'
    - 'TfAskKind'
unnamed-enums:
  include:
    - 'TF_.*'
macros:
  include:
    - 'TF_SDK_VERSION'
globals:
  include: []
typedefs:
  include:
    - 'Tf.*'
comments:
  style: any
  length: full
preamble: |
  // ignore_for_file: type=lint, unused_field, unused_element
