name: quranlab_tajweedformer_record
description: >-
  An optional microphone for quranlab_tajweedformer: captures 16 kHz mono PCM with the record package and pushes
  it into a TajweedFormer take.
version: 4.0.2
homepage: https://sdk.quranlab.ai
repository: https://github.com/Quran-Lab/tajweedformer-flutter
issue_tracker: https://github.com/Quran-Lab/tajweedformer-flutter/issues

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  quranlab_tajweedformer: ^4.0.0
  record: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
